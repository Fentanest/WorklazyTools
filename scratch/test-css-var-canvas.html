<!DOCTYPE html>
<html>
<body>
<canvas id="c" width="100" height="100"></canvas>
<script>
  document.body.style.setProperty('--my-color', 'rgba(255, 0, 0, 0.5)');
  const ctx = document.getElementById('c').getContext('2d');
  ctx.fillStyle = 'var(--my-color)';
  ctx.fillRect(0, 0, 100, 100);
  console.log(ctx.getImageData(50, 50, 1, 1).data);
</script>
</body>
</html>
