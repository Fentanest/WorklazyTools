<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="설치 없이 Excel·Word·HWP·PDF·비디오·이미지 작업을 실행하는 무료 브라우저 업무 도구"
    />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="google-adsense-account" content="ca-pub-8940087269746960" />
    <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Worklazy" />
    <link rel="icon" href="%BASE_URL%icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="%BASE_URL%icon-180.png" />
    <link rel="manifest" href="%BASE_URL%site.webmanifest" />
    <title>무료 문서·PDF·비디오·이미지 업무 도구 | Worklazy Tools</title>
    <style>
      #startup-help[hidden], #startup-help [hidden] { display: none !important; }
      #startup-help { box-sizing: border-box; max-width: 42rem; min-height: 55vh; margin: 0 auto; padding: 4rem 1.5rem; font: 1rem/1.7 system-ui, sans-serif; color: #222; background: #fff; outline: none; }
      #startup-help:focus-visible { outline: 2px solid #555; outline-offset: -2px; }
      #startup-help button { padding: .75rem 1.25rem; border: 1px solid #555; border-radius: .5rem; color: #222; background: #fff; font: inherit; cursor: pointer; }
    </style>
    <script>
      (function () {
        var mounted = false;
        var failed = false;
        function showHelp() {
          var help = document.getElementById("startup-help");
          if (mounted || !failed || !help) return;
          var bilingual = document.body.hasAttribute("data-worklazy-language-landing");
          var language = document.documentElement.lang === "en" ? "en" : "ko";
          help.querySelectorAll("[lang]").forEach(function (item) { item.hidden = !bilingual && item.lang !== language; });
          help.querySelector("[data-startup-separator]").hidden = !bilingual;
          help.hidden = false;
          help.querySelector("button").onclick = function () { location.reload(); };
          help.focus();
        }
        // A definitive module load error has no timeout false positive on slow connections.
        window.addEventListener("error", function (event) {
          if (event.target && event.target.tagName === "SCRIPT" && event.target.type === "module") {
            failed = true;
            showHelp();
          }
        }, true);
        document.addEventListener("DOMContentLoaded", showHelp);
        window.addEventListener("worklazy:mounted", function () {
          mounted = true;
          var help = document.getElementById("startup-help");
          if (help) help.remove();
        });
      })();
    </script>
  </head>
  <body>
    <section id="startup-help" hidden data-nosnippet role="alert" tabindex="-1">
      <p lang="ko">페이지를 열지 못했습니다. 연결을 확인하고 새로고침해 주세요.</p>
      <p lang="en">This page could not be opened. Check your connection and refresh the page.</p>
      <button type="button"><span lang="ko">새로고침</span><span data-startup-separator hidden aria-hidden="true"> · </span><span lang="en">Refresh</span></button>
    </section>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
