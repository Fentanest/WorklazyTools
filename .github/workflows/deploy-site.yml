name: Deploy site
run-name: ${{ github.event_name == 'workflow_dispatch' && (inputs.mode == 'deploy' && 'Site deploy (dispatched)' || 'Validate site build (no deploy)') || (github.event_name == 'schedule' && 'Site deploy (daily data refresh)' || 'Site deploy on main push') }}

# Replacement for deploy-pages.yml (FolioTrace operations plan P3-3). This workflow collects nothing: it never calls DART, holds no
# DART key and writes no repository state. It fetches the FolioTrace public data from the private repository
# Fentanest/foliotrace-site-data (main, v1/manifest.json + v1/snapshots/, delivered by the local orchestrator) with a READ-ONLY deploy
# key (secret FOLIOTRACE_SITE_DATA_READ_KEY), places it at public/data/foliotrace/v1, validates, builds, tests and deploys.
# Missing secret or failed checkout stops the run before any deploy: the site keeps its previous data.
# The local orchestrator starts a deploy with workflow_dispatch (mode=deploy, data_revision=<pushed commit>) after its data push, using a
# fine-grained token limited to this repository's Actions. The site carries the data revision at /data/foliotrace-source.json (tracking only).
# Runner (user decision 2026-10-25): build and deploy run on the self-hosted runner Ubuntu24-Git (labels self-hosted, Linux, X64, 235). The
# `runner` dispatch input is a manual github-hosted fallback; the orchestrator sends only mode/data_revision and gets the default. This
# workflow has no pull-request trigger, so untrusted fork code never reaches that machine. Artifacts and logs are kept 1 day.
# Cutover steps: docs/foliotrace-delivery-and-deploy.md.
#
# Daily refresh also runs independently of FolioTrace delivery, using default main code and published data HEADs.
# Inert until cutover: main pushes and scheduled runs deploy only when FOLIOTRACE_DEPLOY_V2 is 'true' (otherwise skipped).
# A dispatched run is explicit and not gated: mode=validate (default) never touches Pages, mode=deploy publishes.
on:
  push:
    branches: [main]
  schedule:
    # 07:30 KST: normal data landed at 06:20–06:41 KST (10/19–10/28), leaving about 50 minutes.
    # This stays clear of the 08:31 KST FolioTrace run (owner decision).
    - cron: '30 22 * * *'
  workflow_dispatch:
    inputs:
      runner:
        description: Runner for both jobs (default = own machine Ubuntu24-Git; github-hosted only as a manual fallback when it is down)
        required: true
        default: self-hosted
        type: choice
        options:
          - self-hosted
          - github-hosted
      mode:
        description: validate = build and validate only (Pages untouched); deploy = explicit publish
        required: true
        default: validate
        type: choice
        options:
          - validate
          - deploy
      data_revision:
        description: Optional data repository commit the sender just pushed (the run logs a notice if the checked-out head differs)
        required: false
        default: ''
        type: string

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    # Main push and schedule deploy only after cutover. A dispatched run is always explicit and never gated.
    if: github.event_name == 'workflow_dispatch' || vars.FOLIOTRACE_DEPLOY_V2 == 'true'
    runs-on: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.runner == 'github-hosted' && '["ubuntu-latest"]' || '["self-hosted","Linux","X64","235"]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The PDF oracle unit test compares files with a pinned historical
          # commit; a shallow source checkout cannot read those exact blobs.
          fetch-depth: 0

      - name: Remove leftovers of a previous run on this persistent runner
        run: rm -rf foliotrace-site-data market-calendar-state public/data/foliotrace dist

      - name: Require the data repository read key
        env:
          KEY_PRESENT: ${{ secrets.FOLIOTRACE_SITE_DATA_READ_KEY != '' }}
        run: |
          if [ "$KEY_PRESENT" != "true" ]; then echo "::error::FOLIOTRACE_SITE_DATA_READ_KEY is not set; refusing to build without data"; exit 1; fi

      - name: Checkout FolioTrace public data repository (read-only key)
        uses: actions/checkout@v4
        with:
          repository: Fentanest/foliotrace-site-data
          ref: main
          ssh-key: ${{ secrets.FOLIOTRACE_SITE_DATA_READ_KEY }}
          path: foliotrace-site-data
          persist-credentials: false
          fetch-depth: 1

      - name: Remove the data repository read key from this machine
        # actions/checkout writes the key to a uuid-named 600 file under RUNNER_TEMP and removes it in its post step; this also removes it
        # if that step never ran (a persistent machine must not keep the key).
        if: always()
        run: |
          grep -rlsE 'BEGIN (OPENSSH|RSA|EC) PRIVATE KEY' "$RUNNER_TEMP" 2>/dev/null | xargs -r rm -f
          rm -f "$RUNNER_TEMP"/*known_hosts* 2>/dev/null || true

      - name: Place FolioTrace data at the path the screen reads
        run: |
          test -f foliotrace-site-data/v1/manifest.json && test -d foliotrace-site-data/v1/snapshots
          rm -rf public/data/foliotrace
          mkdir -p public/data/foliotrace/v1
          cp -r foliotrace-site-data/v1/. public/data/foliotrace/v1/
          echo "data repository revision: $(git -C foliotrace-site-data rev-parse HEAD)"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Record data repository revision
        id: data-revision
        env:
          REQUESTED: ${{ inputs.data_revision }}
        run: |
          sha=$(git -C foliotrace-site-data rev-parse HEAD)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          node scripts/foliotrace-source-meta.mjs compare "$REQUESTED" "$sha"

      - name: Validate FolioTrace data (contract, hash, size, no private content)
        run: node --experimental-strip-types scripts/validate-foliotrace-snapshot.mjs public --no-html

      - name: Install dependencies
        run: npm ci

      - name: Restore pinned office editor snapshot
        uses: actions/cache@v4
        with:
          path: .cache/zetaoffice/2026-08-25
          key: zetaoffice-2026-08-25-9ebd9a48-3dab0a54-nanum76f45ef4

      - name: Build static site
        run: npm run build
        env:
          VITE_BASE_PATH: /
          VITE_SITE_URL: https://worklazy.net/

      - name: Add FolioTrace static summary to the built pages
        run: node --experimental-strip-types scripts/foliotrace-static-summary.mjs dist

      - name: Validate deployed FolioTrace data and static summary
        run: node --experimental-strip-types scripts/validate-foliotrace-snapshot.mjs dist

      - name: Carry the data source revision on the site (outside the contract folder)
        run: node scripts/foliotrace-source-meta.mjs write dist ${{ steps.data-revision.outputs.sha }}

      - name: Checkout published market calendar
        id: market-calendar
        continue-on-error: true # Calendar availability must not block the site.
        uses: actions/checkout@v4
        with:
          ref: market-calendar-data
          path: market-calendar-state
          persist-credentials: false

      - name: Copy verified market calendar or restore deployed publication
        # Also runs after checkout failure. The script records failures and
        # verifies the current site's copy before restoring it into fresh dist.
        # With no valid publication, the page displays its no-data state.
        run: python3 scripts/copy-market-calendar.py market-calendar-state/public/v1 dist/data/market-calendar/v1 --fallback-published

      - name: Run unit tests
        run: npm run test:unit

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run ad eligibility smoke tests
        run: npm run test:ads

      - name: Check analytics at root and project subpath
        run: npm run test:analytics-base

      - name: Check Coupang disclosure language at root and project subpath
        run: npm run test:coupang-base

      - name: Validate SEO and AdSense files
        run: npm run test:static

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
          retention-days: 1

  deploy:
    needs: build
    if: github.event_name == 'push' || github.event_name == 'schedule' || inputs.mode == 'deploy'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.runner == 'github-hosted' && '["ubuntu-latest"]' || '["self-hosted","Linux","X64","235"]') }}
    steps:
      - name: Check this run is still the newest main
        id: fresh
        env:
          EXPECTED_SOURCE: ${{ github.sha }}
          GH_REPO: ${{ github.repository }}
        run: |
          # A newer main push queues its own run, which then deploys; never publish an older build over it.
          # git ls-remote on the public repository: no token, no gh CLI. A failed request or a non-sha answer fails the step (no deploy).
          set -o pipefail
          latest=$(git ls-remote "https://github.com/${GH_REPO}.git" refs/heads/main | cut -f1)
          printf '%s' "$latest" | grep -qE '^[0-9a-f]{40}$'
          if [ "$latest" = "$EXPECTED_SOURCE" ]; then echo "current=true" >> "$GITHUB_OUTPUT"; else echo "current=false" >> "$GITHUB_OUTPUT"; echo "::notice::main moved to $latest; the newer run deploys"; fi
      - name: Deploy
        id: deployment
        # Manual runs deliberately skip the newest-main guard (they deploy the chosen ref); see docs/foliotrace-delivery-and-deploy.md.
        if: steps.fresh.outputs.current == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/deploy-pages@v4
