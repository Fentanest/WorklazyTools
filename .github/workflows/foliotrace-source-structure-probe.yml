name: Probe FolioTrace source document structure

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: [self-hosted, Linux, X64, '235']
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Inspect three fixed public filing archives
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python3 scripts/foliotrace/source_structure_probe.py source-structure-probe.json
      - uses: actions/upload-artifact@v4
        with:
          name: foliotrace-source-structure
          path: source-structure-probe.json
          retention-days: 7
      - uses: actions/checkout@v4
        if: github.ref != 'refs/heads/main'
        with:
          ref: foliotrace-data
          path: foliotrace-state
      - name: Validate exact KT&G source path without publishing
        if: github.ref != 'refs/heads/main'
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: |
          cp foliotrace-state/state.json "$RUNNER_TEMP/foliotrace-target-state.json"
          python3 scripts/foliotrace/target_source.py --state "$RUNNER_TEMP/foliotrace-target-state.json" \
            --receipt 20251114002334 --corp 00244455 --filing-date 2025-11-14
          python3 scripts/foliotrace/target_source.py --state "$RUNNER_TEMP/foliotrace-target-state.json" \
            --receipt 20260515002914 --corp 00244455 --filing-date 2026-05-15
          python3 - <<'PY'
          from pathlib import Path
          import os
          from scripts.foliotrace.folio import read_json, write_json
          target = Path(os.environ['RUNNER_TEMP']) / 'foliotrace-target-state.json'
          state = read_json(target)
          state['secondary_source_cache']['20251114002334']['parser_version'] = 'previous-version'
          write_json(target, state)
          PY
          python3 scripts/foliotrace/target_source.py --state "$RUNNER_TEMP/foliotrace-target-state.json" \
            --receipt 20251114002334 --corp 00244455 --filing-date 2025-11-14
          python3 - <<'PY'
          from pathlib import Path
          import os, json
          from scripts.foliotrace.folio import read_json
          from pipeline.foliotrace.publish import make_snapshot
          state = read_json(Path(os.environ['RUNNER_TEMP']) / 'foliotrace-target-state.json')
          row = next((row for row in make_snapshot(state, {})['holdings'] if row['corpCode'] == '00244455'), None)
          print(json.dumps({'ktng_row': {key: row.get(key) for key in
              ('companyOwnershipPercent', 'holdingDate', 'evidence', 'quantity', 'estimatedValue')}
              if row else None, 'issuer_scope_observations': [
                {'basis_date': fact['basis_date'], 'quantity': fact['quantity'],
                 'ownership_percent': fact['ownership_percent'],
                 'references': len(fact['references'])}
                for fact in sorted((state.get('issuer_scope_observations') or {}).values(),
                                   key=lambda item: item['basis_date'])]},
              sort_keys=True))
          PY
