name: Product banner tests
on:
  push:
    branches: [main]
    paths: ['src/features/product-banner/**', 'tests/product-banner/**', 'tests/unit/product-banner-*', 'tests/fixtures/product-banner/**', 'scripts/*product-banner*', 'package*.json', 'vite.config.ts', 'src/app/**', 'src/locales/**', 'public/product-banner-samples/**', '.github/workflows/product-banner-tests.yml']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  banner:
    # Self-hosted Ubuntu24-Git (user decision 2026-10-25) for push, workflow_dispatch and same-repository pull requests only.
    # SECURITY: public repository. The expression below is only a convenience and NOT a security boundary: a fork pull request runs its
    # own (possibly modified) copy of this workflow file. The real boundary is the repository setting "Require approval for all external
    # contributors" (approval_policy=all_external_contributors, set 2026-10-25), which must stay on. The approver must read the fork PR's
    # `.github/workflows` changes before approving. Ubuntu24-Git has passwordless sudo, so approving a fork PR = its code runs as root there.
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && '["ubuntu-latest"]' || '["self-hosted","Linux","X64","235"]') }}
    timeout-minutes: 25
    env:
      PB_JOB_ROOT: ${{ github.workspace }}/docs/jobs/todo/product-banner/work/tmp/ci
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/docs/jobs/todo/product-banner/work/tmp/ci/browsers
    steps:
      - name: Remove leftovers of a previous run on this persistent runner
        if: runner.environment == 'self-hosted'
        run: rm -rf "$PB_JOB_ROOT"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Build and execute banner cases
        run: |
          mkdir -p "$PB_JOB_ROOT"/{tmp,cache,config,data,runtime}
          export TMPDIR="$PB_JOB_ROOT/tmp" TMP="$PB_JOB_ROOT/tmp" TEMP="$PB_JOB_ROOT/tmp"
          export XDG_CACHE_HOME="$PB_JOB_ROOT/cache" XDG_CONFIG_HOME="$PB_JOB_ROOT/config" XDG_DATA_HOME="$PB_JOB_ROOT/data" XDG_RUNTIME_DIR="$PB_JOB_ROOT/runtime" GSETTINGS_BACKEND=memory
          npm run build:product-banner-tests
          npm run test:product-banner
      - name: Clean this run's leftovers on the persistent runner
        # Last step: removes only what this run created (this job's tmp dir
        # under the workspace + this job's temp dir contents). Never touches
        # other repositories, system folders, or docker. Deletion failures are
        # logged with their real error and surfaced as ::warning:: (never
        # hidden); "removed" is printed only when the path is actually gone.
        # The step always exits 0 so cleanup never changes the job result.
        if: always()
        run: |
          set -u
          cleanup_failed=0
          echo "=== disk before runner cleanup ==="
          df -h
          if [ -n "${PB_JOB_ROOT:-}" ] && [ -d "$PB_JOB_ROOT" ]; then
            du -sh "$PB_JOB_ROOT" 2>/dev/null || true
            rm_status=0
            rm_err=$(rm -rf "$PB_JOB_ROOT" 2>&1) || rm_status=$?
            if [ -e "$PB_JOB_ROOT" ]; then
              echo "::warning::failed to remove $PB_JOB_ROOT (rm exit $rm_status): $rm_err"
              cleanup_failed=1
            else
              echo "removed: $PB_JOB_ROOT"
              if [ "$rm_status" -ne 0 ]; then
                echo "::warning::rm for $PB_JOB_ROOT exited $rm_status but the path is gone: $rm_err"
                cleanup_failed=1
              fi
            fi
          else
            echo "PB_JOB_ROOT absent, skipping"
          fi
          echo "node_modules: kept (explicitly excluded)"
          if [ -n "${RUNNER_TEMP:-}" ] && [ -d "$RUNNER_TEMP" ]; then
            du -sh "$RUNNER_TEMP" 2>/dev/null || true
            echo "entries before removal:"
            find "$RUNNER_TEMP" -mindepth 1 -maxdepth 1 -print 2>&1 | head -30
            find_status=0
            find_err=$(find "$RUNNER_TEMP" -mindepth 1 -maxdepth 1 -exec rm -rf {} + 2>&1) || find_status=$?
            if [ "$find_status" -ne 0 ]; then
              echo "::warning::RUNNER_TEMP cleanup errors (find exit $find_status): $find_err"
              cleanup_failed=1
            elif [ -n "$find_err" ]; then
              echo "RUNNER_TEMP cleanup notes: $find_err"
            fi
            leftover=$(find "$RUNNER_TEMP" -mindepth 1 -maxdepth 1 -print 2>&1 | head -30)
            if [ -n "$leftover" ]; then
              echo "::warning::RUNNER_TEMP still has entries after cleanup:"
              echo "$leftover"
              cleanup_failed=1
            else
              echo "RUNNER_TEMP contents removed (this job temp only, directory itself kept)"
            fi
          else
            echo "RUNNER_TEMP missing; skipping"
          fi
          echo "=== disk after runner cleanup ==="
          df -h
          if [ "$cleanup_failed" -ne 0 ]; then
            echo "::warning::runner cleanup finished with failures (see above); job result unchanged"
          fi
          # Warnings only: cleanup must never change the job result.
          exit 0
