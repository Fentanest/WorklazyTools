name: Product banner tests
on:
  push:
    branches: [main]
    paths: ['src/features/product-banner/**', 'tests/product-banner/**', 'tests/unit/product-banner-*', 'tests/fixtures/product-banner/**', 'scripts/*product-banner*', 'package*.json', 'vite.config.ts', 'src/app/**', 'src/locales/**', 'public/product-banner-samples/**', '.github/workflows/product-banner-tests.yml']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  banner:
    # Self-hosted Ubuntu24-Git (user decision 2026-10-25) for push, workflow_dispatch and same-repository pull requests only.
    # SECURITY: public repository. The expression below is only a convenience and NOT a security boundary: a fork pull request runs its
    # own (possibly modified) copy of this workflow file. The real boundary is the repository setting "Require approval for all external
    # contributors" (approval_policy=all_external_contributors, set 2026-10-25), which must stay on. The approver must read the fork PR's
    # `.github/workflows` changes before approving. Ubuntu24-Git has passwordless sudo, so approving a fork PR = its code runs as root there.
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && '["ubuntu-latest"]' || '["self-hosted","Linux","X64","235"]') }}
    timeout-minutes: 25
    env:
      PB_JOB_ROOT: ${{ github.workspace }}/docs/jobs/todo/product-banner/work/tmp/ci
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/docs/jobs/todo/product-banner/work/tmp/ci/browsers
    steps:
      - name: Remove leftovers of a previous run on this persistent runner
        if: runner.environment == 'self-hosted'
        run: rm -rf "$PB_JOB_ROOT"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Build and execute banner cases
        run: |
          mkdir -p "$PB_JOB_ROOT"/{tmp,cache,config,data,runtime}
          export TMPDIR="$PB_JOB_ROOT/tmp" TMP="$PB_JOB_ROOT/tmp" TEMP="$PB_JOB_ROOT/tmp"
          export XDG_CACHE_HOME="$PB_JOB_ROOT/cache" XDG_CONFIG_HOME="$PB_JOB_ROOT/config" XDG_DATA_HOME="$PB_JOB_ROOT/data" XDG_RUNTIME_DIR="$PB_JOB_ROOT/runtime" GSETTINGS_BACKEND=memory
          npm run build:product-banner-tests
          npm run test:product-banner
