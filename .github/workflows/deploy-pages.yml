name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      runner:
        description: Build runner
        required: true
        default: self-hosted
        type: choice
        options:
          - self-hosted
          - github-hosted
      validate_only:
        description: Run collection, pricing, and build without publishing Pages
        required: true
        default: false
        type: boolean
  schedule:
    - cron: '10 7 * * *' # 16:10 Asia/Seoul

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: write # Commit only the normalized FolioTrace state on its dedicated branch.
    runs-on: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.runner == 'github-hosted' && '["ubuntu-latest"]' || '["self-hosted","Linux","X64","235"]') }}
    outputs:
      data_sha: ${{ steps.persist-price.outputs.sha }}
      dataset_version: ${{ steps.snapshot-meta.outputs.dataset_version }}
      trade_date: ${{ steps.snapshot-meta.outputs.trade_date }}
      estimated_value: ${{ steps.snapshot-meta.outputs.estimated_value }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore persistent FolioTrace state
        id: restore
        uses: actions/checkout@v4
        with:
          ref: foliotrace-data
          path: foliotrace-state
          fetch-depth: 0

      - name: Verify imported seed exists
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path('foliotrace-state/state.json')
          if not path.is_file() or not json.loads(path.read_text()).get('import_ledger'):
              raise SystemExit('IMPORT_PENDING_SOURCE: normalized FolioTrace seed missing')
          PY

      - name: Test FolioTrace migration and valuation invariants
        run: npm run test:foliotrace

      - name: Collect incremental DART filings
        id: collect
        continue-on-error: true # Persist completed chunks before failing this deployment.
        run: python3 scripts/foliotrace/folio.py collect --state foliotrace-state/state.json
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}

      - name: Persist normalized collection state
        id: persist-data
        if: always() && steps.restore.outcome == 'success'
        run: |
          git -C foliotrace-state config user.name 'github-actions[bot]'
          git -C foliotrace-state config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C foliotrace-state add state.json
          if ! git -C foliotrace-state diff --cached --quiet; then
            git -C foliotrace-state commit -m 'data: update FolioTrace DART collection state'
            git -C foliotrace-state push origin HEAD:refs/heads/foliotrace-data
          fi
          echo "sha=$(git -C foliotrace-state rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Require complete DART listing
        if: steps.collect.outcome != 'success'
        run: exit 1

      - name: Wait for regular close confirmation on the scheduled run
        if: github.event_name == 'schedule'
        run: |
          python3 - <<'PY'
          from datetime import datetime, time, timedelta
          from zoneinfo import ZoneInfo
          import time as clock
          now = datetime.now(ZoneInfo('Asia/Seoul'))
          target = now.replace(hour=16, minute=35, second=0, microsecond=0)
          if now.weekday() < 5 and time(16, 0) <= now.time() < target.time():
              clock.sleep(min((target - now).total_seconds(), 35 * 60))
          PY

      - name: Verify regular close and value portfolio
        run: python3 scripts/foliotrace/folio.py price-and-value --state foliotrace-state/state.json --output foliotrace-state/publish.json

      - name: Persist verified quote cache
        id: persist-price
        run: |
          git -C foliotrace-state add state.json
          if ! git -C foliotrace-state diff --cached --quiet; then
            git -C foliotrace-state commit -m 'data: cache verified FolioTrace closes'
            git -C foliotrace-state push origin HEAD:refs/heads/foliotrace-data
          fi
          echo "sha=$(git -C foliotrace-state rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Pin snapshot metadata
        id: snapshot-meta
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          data = json.loads(Path('foliotrace-state/publish.json').read_text())
          for output, key in [('dataset_version', 'datasetVersion'), ('trade_date', 'valuationTradeDate'), ('estimated_value', 'estimatedValue')]:
              print(f'{output}={data.get(key) or ""}')
          PY

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore pinned office editor snapshot
        uses: actions/cache@v4
        with:
          path: .cache/zetaoffice/2026-08-25
          key: zetaoffice-2026-08-25-9ebd9a48-3dab0a54-nanum76f45ef4

      - name: Build static site
        run: npm run build
        env:
          VITE_BASE_PATH: /
          VITE_SITE_URL: https://worklazy.net/

      - name: Emit versioned FolioTrace snapshot and matching HTML
        run: python3 scripts/foliotrace/folio.py emit-snapshot --snapshot foliotrace-state/publish.json --dist dist

      - name: Validate deployed FolioTrace contract and HTML
        run: node --experimental-strip-types scripts/validate-foliotrace-snapshot.mjs dist

      - name: Run unit tests
        run: npm run test:unit

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run ad eligibility smoke tests
        run: npm run test:ads

      - name: Validate SEO and AdSense files
        run: npm run test:static

      - name: Setup FFmpeg for the hybrid smoke
        uses: FedericoCarboni/setup-ffmpeg@37062fbf7149fc5578d6c57e08aed62458b375d6 # v3.1
        with:
          ffmpeg-version: release

      - name: Verify the small hybrid video route
        run: npm run test:video-hybrid

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'workflow_dispatch' || !inputs.validate_only
    permissions:
      contents: write # Record only the successfully deployed FolioTrace valuation history.
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout for revision guard
        uses: actions/checkout@v4
      - name: Check current source and data revisions
        env:
          EXPECTED_SOURCE: ${{ github.sha }}
          EXPECTED_DATA: ${{ needs.build.outputs.data_sha }}
        run: |
          source_sha=$(git ls-remote origin refs/heads/main | cut -f1)
          data_sha=$(git ls-remote origin refs/heads/foliotrace-data | cut -f1)
          test "$source_sha" = "$EXPECTED_SOURCE"
          test "$data_sha" = "$EXPECTED_DATA"
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Checkout pinned FolioTrace data for published history
        uses: actions/checkout@v4
        with:
          ref: foliotrace-data
          path: foliotrace-state
          fetch-depth: 0
      - name: Record successfully published dataset
        env:
          EXPECTED_DATA: ${{ needs.build.outputs.data_sha }}
          DATASET_VERSION: ${{ needs.build.outputs.dataset_version }}
          TRADE_DATE: ${{ needs.build.outputs.trade_date }}
          ESTIMATED_VALUE: ${{ needs.build.outputs.estimated_value }}
        run: |
          test "$(git -C foliotrace-state rev-parse HEAD)" = "$EXPECTED_DATA"
          python3 - <<'PY'
          import os
          from pathlib import Path
          from scripts.foliotrace.folio import record_published
          result = record_published(Path('foliotrace-state/state.json'), version=os.environ['DATASET_VERSION'],
                                    trade_date=os.environ['TRADE_DATE'] or None,
                                    estimated_value=os.environ['ESTIMATED_VALUE'] or None)
          print(result)
          PY
          git -C foliotrace-state config user.name 'github-actions[bot]'
          git -C foliotrace-state config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C foliotrace-state add state.json
          if ! git -C foliotrace-state diff --cached --quiet; then
            git -C foliotrace-state commit -m 'data: record published FolioTrace dataset'
            git -C foliotrace-state push origin HEAD:refs/heads/foliotrace-data
          fi
