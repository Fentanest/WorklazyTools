name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      runner:
        description: Build runner
        required: true
        default: self-hosted
        type: choice
        options:
          - self-hosted
          - github-hosted

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.runner == 'github-hosted' && '["ubuntu-latest"]' || '["self-hosted","Linux","X64","235"]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore pinned office editor snapshot
        uses: actions/cache@v4
        with:
          path: .cache/zetaoffice/2026-08-25
          key: zetaoffice-2026-08-25-9ebd9a48-3dab0a54-nanum76f45ef4

      - name: Build static site
        run: npm run build
        env:
          VITE_BASE_PATH: /
          VITE_SITE_URL: https://worklazy.net/

      - name: Validate SEO and AdSense files
        run: npm run test:static

      - name: Setup FFmpeg for the hybrid smoke
        uses: AnimMouse/setup-ffmpeg@178e0b4a408f06ce40d896c3cd79f50fa6f8b0c3 # v1.2.5
        with:
          version: "7.1"

      - name: Verify the small hybrid video route
        run: npm run test:video-hybrid

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
